name: Jira validation

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - ready_for_review
      - reopened

jobs:
  jira:
    name: Jira validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Require bot token
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::Failed to mint kubevirt-plugin-bot installation token. Check org secrets BOT_APP_ID and BOT_APP_PRIVATE_KEY and that the App is installed on this repository with Issues + Pull requests write."
            exit 1
          fi

      - name: Validate PR title against Jira
        uses: ./
        with:
          base-branch: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          repo-name: ${{ github.event.pull_request.base.repo.name }}
          repo-owner: ${{ github.event.pull_request.base.repo.owner.login }}
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          STATUS_GITHUB_TOKEN: ${{ github.token }}
