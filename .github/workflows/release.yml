name: Release action

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing immutable release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  update-floating-tags:
    name: Update vMAJOR and latest tags
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease != true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semver tag vMAJOR.MINOR.PATCH, got: $TAG_NAME"
            exit 1
          fi
          major_tag="${TAG_NAME%%.*}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "major_tag=${major_tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag_name }}
          fetch-depth: 1

      - name: Push floating tags
        env:
          MAJOR_TAG: ${{ steps.meta.outputs.major_tag }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "${MAJOR_TAG}" "${sha}"
          git push origin "refs/tags/${MAJOR_TAG}" --force

          git tag -f latest "${sha}"
          git push origin refs/tags/latest --force

          echo "Updated ${MAJOR_TAG} and latest -> ${sha} (${TAG_NAME})"
